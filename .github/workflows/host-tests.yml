name: Host tests

on:
  push:
  pull_request:

jobs:
  host:
    # Pin the runner image so compiler and gcov versions do not drift with
    # ubuntu-latest. The native MC/DC build requires GCC 14 or newer.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 14 for native MC/DC coverage
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-14 g++-14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pytest
        run: python -m pip install -r requirements-dev.txt
      - name: Run Python, PTY integration, and native CTest suites
        env:
          CC: gcc-14
          CXX: g++-14
          GCOV: gcov-14
        run: ./run_host_tests.sh
      - name: Upload host test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-reports
          if-no-files-found: warn
          path: |
            build/coverage/index.html
            build/coverage/python-results.xml
            build/coverage/python-tests.log
            build/coverage/native-tests.log
            build/unit-mcdc-coverage/gcov-report/summary.txt
