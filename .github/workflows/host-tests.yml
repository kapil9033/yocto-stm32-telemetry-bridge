name: Host tests

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pytest
        run: python -m pip install -r requirements-dev.txt
      - name: Run Python, PTY integration, and native CTest suites
        run: ./run_host_tests.sh
