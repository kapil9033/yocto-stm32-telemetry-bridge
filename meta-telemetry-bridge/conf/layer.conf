BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-telemetry-bridge"
BBFILE_PATTERN_meta-telemetry-bridge = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-telemetry-bridge = "6"

LAYERVERSION_meta-telemetry-bridge = "1"
LAYERSERIES_COMPAT_meta-telemetry-bridge = "scarthgap nanbield mickledore kirkstone honister hardknott dunfell"

# =================================================================
# STM32 Telemetry Bridge - Hardware & Build Configuration
# =================================================================

# Enable hardware interfaces required on Raspberry Pi
ENABLE_UART = "1"
ENABLE_I2C = "1"
ENABLE_SPI = "1"

# Automatically enable Mini-UART / UART1 overlay on Raspberry Pi
RPI_EXTRA_CONFIG:append = "\ndtoverlay=uart1\n"
